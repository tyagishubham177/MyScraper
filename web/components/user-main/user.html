<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="user.css">
</head>
<body>
  <div id="particles-js" aria-hidden="true"></div>
  <div id="particles-js-bg" aria-hidden="true"></div>
  <div id="global-loader" class="loading-overlay" style="display:none;">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="page-header">
    <div class="container">
      <img src="../../assets/brand_logo.png" alt="Amul Logo">
      <h1>Dashboard</h1>
      <div style="width: 28px;"></div> <!-- Spacer for flex-between alignment -->
    </div>
  </div>

  <div class="container py-5 mt-4">
    <div id="welcome-msg" class="initial"></div>
    <div id="user-subscriptions-container"></div>
  </div>

  <button type="button" class="fab" data-bs-toggle="offcanvas" data-bs-target="#settingsPane" aria-controls="settingsPane" aria-label="Open Settings">
    <i data-lucide="menu"></i>
  </button>

  <div class="offcanvas" tabindex="-1" id="settingsPane" aria-labelledby="settingsPaneLabel">
    <div class="offcanvas-header">
      <h5 id="settingsPaneLabel" class="offcanvas-title">Preferences</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div>
        <h6>Account Profile</h6>
        <button type="button" id="change-username-btn" class="btn btn-outline-primary w-100 mb-3">
          <i data-lucide="user" aria-hidden="true"></i> Display Name
        </button>
        <button type="button" id="switch-to-admin-btn" class="btn btn-secondary w-100 mb-3">
          <i data-lucide="shield" aria-hidden="true"></i> Admin Console
        </button>
        <button type="button" id="logout-btn" class="btn btn-danger w-100">
          <i data-lucide="log-out" aria-hidden="true"></i> Secure Logout
        </button>

        <hr>

        <h6>Delivery Configuration</h6>
        <div class="mt-2 text-start">
          <label for="pincode-input" class="form-label">Service Pincode</label>
          <input type="text" id="pincode-input" class="form-control" placeholder="e.g. 201305" inputmode="numeric" pattern="\d{6}">
          <div class="form-text mb-3">Enter your 6-digit delivery region code</div>
          <button type="button" id="save-pincode-btn" class="btn btn-primary w-100">
            <i data-lucide="save"></i> Update Region
          </button>
        </div>
      </div>
      
      <hr>
      
      <div>
        <h6>Support & Feedback</h6>
        <a href="#" id="feedbackGmail" class="btn btn-outline-primary w-100 mb-3">
          <i data-lucide="mail"></i> Email Support
        </a>
        <a href="https://www.reddit.com/message/compose/?to=ShooBum-T&subject=Feedback&message=I%20would%20like%20to%20request%20a%20new%20product%20or%20send%20feedback" target="_blank" id="feedbackReddit" class="btn btn-outline-danger w-100">
          <i data-lucide="message-circle"></i> Reddit Contact
        </a>
      </div>
    </div>
  </div>

  <!-- Minimal Modal for Display Name -->
  <div class="modal fade" id="usernameModal" tabindex="-1" aria-labelledby="usernameModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="usernameModalLabel">Update Alias</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="username-input" class="form-control" placeholder="Enter new display name">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="save-username-btn">
            <i data-lucide="check"></i> Confirm
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../particles.js"></script>
  <script src="../../lucide-icons.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./user-main.js"></script>
  <script type="module">
    document.addEventListener('DOMContentLoaded', () => {});
  </script>
</body>
</html>
